<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Files - PDF Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2rem;
        }
        
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        
        .back-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .info-banner {
            background: #d5f4e6;
            border-left: 4px solid #27ae60;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #27ae60;
        }
        
        .file-count {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 20px;
        }
        
        .file-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .file-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 150px 80px;
            gap: 20px;
            padding: 20px;
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        
        .file-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 150px 80px;
            gap: 20px;
            padding: 20px;
            border-bottom: 1px solid #ecf0f1;
            align-items: center;
            transition: all 0.3s;
        }
        
        .file-item:hover {
            background: #f8f9fa;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-name {
            color: #2c3e50;
            font-weight: 500;
            word-break: break-word;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .file-time {
            color: #95a5a6;
            font-size: 14px;
        }
        
        .time-remaining {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }
        
        .time-remaining.safe {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .time-remaining.warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .time-remaining.danger {
            background: #f8d7da;
            color: #721c24;
        }
        
        .delete-btn {
            padding: 8px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        
        .delete-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 18px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #3498db;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fadbd8;
            color: #e74c3c;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin-bottom: 20px;
        }
        
        .success {
            background: #d5f4e6;
            color: #27ae60;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .file-header,
            .file-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .file-header::before,
            .file-item::before {
                content: attr(data-label);
                font-weight: 600;
                color: #2c3e50;
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 Uploaded Files</h1>
            <a href="/tools" class="back-btn">← Back to Tools</a>
        </div>
        
        <div class="info-banner">
            ⏰ Files are automatically deleted after 1 hour of upload. Check remaining time for each file.
        </div>
        
        <div id="message"></div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading files...</p>
        </div>
        
        <div id="content" style="display: none;">
            <div id="fileCount" class="file-count"></div>
            
            <div class="file-list" id="fileList"></div>
        </div>
    </div>
    
    <script>
        // Load uploaded files
        async function loadFiles() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            const message = document.getElementById('message');
            
            loading.style.display = 'block';
            content.style.display = 'none';
            message.innerHTML = '';
            
            try {
                const response = await fetch('/api/uploads');
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load files');
                }
                
                loading.style.display = 'none';
                
                if (data.files.length === 0) {
                    document.getElementById('fileList').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-text">No files uploaded yet</div>
                            <p>Your uploaded files will appear here (max 1 hour retention)</p>
                        </div>
                    `;
                } else {
                    renderFiles(data.files);
                }
                
                document.getElementById('fileCount').textContent = 
                    `📊 Total Files: ${data.total_files}`;
                
                content.style.display = 'block';
            } catch (error) {
                loading.style.display = 'none';
                message.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                content.style.display = 'block';
            }
        }
        
        function renderFiles(files) {
            const fileList = document.getElementById('fileList');
            
            let html = `
                <div class="file-header">
                    <div>File Name</div>
                    <div>Size</div>
                    <div>Uploaded At</div>
                    <div>Expires In</div>
                    <div>Action</div>
                </div>
            `;
            
            files.forEach(file => {
                const timeRemaining = file.time_remaining;
                let timeClass = 'safe';
                
                if (timeRemaining.includes('Expired')) {
                    timeClass = 'danger';
                } else if (timeRemaining.includes('m') && parseInt(timeRemaining) < 15) {
                    timeClass = 'warning';
                }
                
                html += `
                    <div class="file-item">
                        <div>
                            <div class="file-name">📄 ${escapeHtml(file.filename)}</div>
                        </div>
                        <div>
                            <div class="file-size">${file.file_size}</div>
                        </div>
                        <div>
                            <div class="file-time">${file.uploaded_at}</div>
                        </div>
                        <div>
                            <div class="time-remaining ${timeClass}">${timeRemaining}</div>
                        </div>
                        <div>
                            <button class="delete-btn" onclick="deleteFile('${file.id}')">Delete</button>
                        </div>
                    </div>
                `;
            });
            
            fileList.innerHTML = html;
        }
        
        async function deleteFile(fileId) {
            if (!confirm('Are you sure you want to delete this file?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/file/${fileId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to delete file');
                }
                
                // Show success message
                const message = document.getElementById('message');
                message.innerHTML = '<div class="success">✅ File deleted successfully</div>';
                
                // Reload files after a short delay
                setTimeout(() => {
                    loadFiles();
                }, 1000);
            } catch (error) {
                const message = document.getElementById('message');
                message.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // Auto-refresh every 30 seconds
        setInterval(loadFiles, 30000);
        
        // Load files on page load
        window.addEventListener('load', loadFiles);
    </script>
</body>
</html>
